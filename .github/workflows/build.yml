name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q *.zip
          fi

      - name: Inject New UI Design (Smart Trick)
        run: |
          # ఇది మీరు విడిగా అప్‌లోడ్ చేసిన కొత్త డిజైన్‌ని ఆటోమేటిక్ గా పాత యాప్ లోపలికి పంపేస్తుంది!
          if [ -f MainActivity.kt ]; then
            find . -name "MainActivity.kt" -not -path "./MainActivity.kt" -exec cp MainActivity.kt {} \;
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Fix Black Screen Runtime Crash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > local.properties
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=false" > ~/.gradle/gradle.properties
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties
          
          find . -name "build.gradle.kts" -exec sed -i 's/compileSdk.*/compileSdk = 36/g' {} +
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/^agp = .*/agp = "8.9.1"/' gradle/libs.versions.toml
          fi
          if [ -f google-services.json ]; then
            mkdir -p app
            mv google-services.json app/
          fi
          
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 1000 -dname "CN=Android"
          find . -name "build.gradle*" -exec sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' {} +

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"
