name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q *.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Ultimate Code Fix (Versions & Keystore)
        run: |
          # 1. API Key Setup
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          
          # 2. Memory & AWT Fix (This fixes the NullPointerException)
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=false" > ~/.gradle/gradle.properties
          
          # 3. Fix Corrupted Versions in TOML file (This fixes the Compose mismatch)
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/agp = .*/agp = "8.5.0"/' gradle/libs.versions.toml
            sed -i 's/kotlin = .*/kotlin = "2.0.0"/' gradle/libs.versions.toml
            sed -i 's/googleDevtoolsKsp = .*/googleDevtoolsKsp = "2.0.0-1.0.21"/' gradle/libs.versions.toml
          fi
          
          # 4. Google Services Dummy File Fix
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "1", "project_id": "dummy" },
            "client": [ {
              "client_info": { "mobilesdk_app_id": "1:1:android:1", "android_client_info": { "package_name": "com.aistudio.aivideocreator.hub.v3x" } },
              "api_key": [ { "current_key": "AIzaSyDummyKeyDummyKeyDummyKeyDummyKeyD" } ]
            } ]
          }
          EOF
          
          # 5. Keystore Fix
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 1000 -dname "CN=Android"
          find . -name "build.gradle*" -exec sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' {} +
          
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"

