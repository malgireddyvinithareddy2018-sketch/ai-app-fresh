name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q *.zip
          fi

      - name: Setup Virtual Display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1024x768x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: The Brahmastra (Safe UI Rewrite)
        run: |
          # 1. Rewrite MainActivity safely
          MAIN_ACTIVITY=$(find . -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            PACKAGE_NAME=$(grep "^package " "$MAIN_ACTIVITY" | head -n 1)
            echo "$PACKAGE_NAME" > "$MAIN_ACTIVITY"
            echo 'import android.os.Bundle' >> "$MAIN_ACTIVITY"
            echo 'import androidx.activity.ComponentActivity' >> "$MAIN_ACTIVITY"
            echo 'import androidx.activity.compose.setContent' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.foundation.background' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.foundation.layout.*' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.foundation.shape.RoundedCornerShape' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.material.icons.Icons' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.material.icons.filled.ArrowBack' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.material3.*' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.runtime.*' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.ui.Alignment' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.ui.Modifier' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.ui.graphics.Color' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.ui.text.font.FontWeight' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.ui.unit.dp' >> "$MAIN_ACTIVITY"
            echo 'import androidx.compose.ui.unit.sp' >> "$MAIN_ACTIVITY"
            echo 'class MainActivity : ComponentActivity() {' >> "$MAIN_ACTIVITY"
            echo '    override fun onCreate(savedInstanceState: Bundle?) {' >> "$MAIN_ACTIVITY"
            echo '        super.onCreate(savedInstanceState)' >> "$MAIN_ACTIVITY"
            echo '        setContent {' >> "$MAIN_ACTIVITY"
            echo '            MaterialTheme { AiScriptMakerScreen(onBackClick = { finish() }) }' >> "$MAIN_ACTIVITY"
            echo '        }' >> "$MAIN_ACTIVITY"
            echo '    }' >> "$MAIN_ACTIVITY"
            echo '}' >> "$MAIN_ACTIVITY"
            echo '@Composable' >> "$MAIN_ACTIVITY"
            echo 'fun AiScriptMakerScreen(onBackClick: () -> Unit) {' >> "$MAIN_ACTIVITY"
            echo '    var topic by remember { mutableStateOf("") }' >> "$MAIN_ACTIVITY"
            echo '    var selectedPlatform by remember { mutableStateOf("Insta Reel") }' >> "$MAIN_ACTIVITY"
            echo '    var showResult by remember { mutableStateOf(false) }' >> "$MAIN_ACTIVITY"
            echo '    Column(modifier = Modifier.fillMaxSize().background(Color(0xFF121212)).padding(16.dp)) {' >> "$MAIN_ACTIVITY"
            echo '        Row(verticalAlignment = Alignment.CenterVertically) {' >> "$MAIN_ACTIVITY"
            echo '            IconButton(onClick = onBackClick) { Icon(Icons.Default.ArrowBack, "Back", tint = Color.White) }' >> "$MAIN_ACTIVITY"
            echo '            Text("✨ AI Script Maker", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)' >> "$MAIN_ACTIVITY"
            echo '        }' >> "$MAIN_ACTIVITY"
            echo '        Spacer(modifier = Modifier.height(20.dp))' >> "$MAIN_ACTIVITY"
            echo '        OutlinedTextField(value = topic, onValueChange = { topic = it }, label = { Text("Enter your topic", color = Color.Gray) }, colors = TextFieldDefaults.colors(focusedIndicatorColor = Color(0xFF00E676), unfocusedIndicatorColor = Color.DarkGray, focusedContainerColor = Color.Transparent, unfocusedContainerColor = Color.Transparent, focusedTextColor = Color.White, unfocusedTextColor = Color.White), modifier = Modifier.fillMaxWidth())' >> "$MAIN_ACTIVITY"
            echo '        Spacer(modifier = Modifier.height(16.dp))' >> "$MAIN_ACTIVITY"
            echo '        Text("Select Platform:", color = Color.White, fontSize = 16.sp)' >> "$MAIN_ACTIVITY"
            echo '        Spacer(modifier = Modifier.height(8.dp))' >> "$MAIN_ACTIVITY"
            echo '        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {' >> "$MAIN_ACTIVITY"
            echo '            listOf("Insta Reel", "YouTube", "Shorts").forEach { platform ->' >> "$MAIN_ACTIVITY"
            echo '                Button(onClick = { selectedPlatform = platform }, colors = ButtonDefaults.buttonColors(containerColor = if (selectedPlatform == platform) Color(0xFF00E676) else Color.DarkGray)) { Text(platform, color = if (selectedPlatform == platform) Color.Black else Color.White) }' >> "$MAIN_ACTIVITY"
            echo '            }' >> "$MAIN_ACTIVITY"
            echo '        }' >> "$MAIN_ACTIVITY"
            echo '        Spacer(modifier = Modifier.height(32.dp))' >> "$MAIN_ACTIVITY"
            echo '        Button(onClick = { showResult = true }, modifier = Modifier.fillMaxWidth().height(55.dp), colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E676)), shape = RoundedCornerShape(12.dp)) { Text("Generate Magic 🪄", color = Color.Black, fontSize = 18.sp, fontWeight = FontWeight.Bold) }' >> "$MAIN_ACTIVITY"
            echo '        Spacer(modifier = Modifier.height(24.dp))' >> "$MAIN_ACTIVITY"
            echo '        if (showResult && topic.isNotEmpty()) {' >> "$MAIN_ACTIVITY"
            echo '            Card(colors = CardDefaults.cardColors(containerColor = Color(0xFF1E1E1E)), modifier = Modifier.fillMaxWidth()) {' >> "$MAIN_ACTIVITY"
            echo '                Column(modifier = Modifier.padding(16.dp)) {' >> "$MAIN_ACTIVITY"
            echo '                    Text("🪝 Hook: Are you making this simple mistake?", color = Color(0xFF00E676), fontWeight = FontWeight.Bold)' >> "$MAIN_ACTIVITY"
            echo '                    Spacer(modifier = Modifier.height(8.dp))' >> "$MAIN_ACTIVITY"
            echo '                    Text("📜 Script: Welcome back! Today we talk about $topic...", color = Color.White)' >> "$MAIN_ACTIVITY"
            echo '                    Spacer(modifier = Modifier.height(8.dp))' >> "$MAIN_ACTIVITY"
            echo '                    Text("🏷️ Tags: #$topic #viral", color = Color.Cyan)' >> "$MAIN_ACTIVITY"
            echo '                }' >> "$MAIN_ACTIVITY"
            echo '            }' >> "$MAIN_ACTIVITY"
            echo '        }' >> "$MAIN_ACTIVITY"
            echo '    }' >> "$MAIN_ACTIVITY"
            echo '}' >> "$MAIN_ACTIVITY"
          fi
          
          # 2. Empty MainApplication to prevent Firebase/Gemini runtime crashes
          APP_CLASS=$(find . -name "MainApplication.kt" | head -n 1)
          if [ -n "$APP_CLASS" ]; then
            PACKAGE_NAME=$(grep "^package " "$APP_CLASS" | head -n 1)
            echo "$PACKAGE_NAME" > "$APP_CLASS"
            echo 'import android.app.Application' >> "$APP_CLASS"
            echo 'class MainApplication : Application() {' >> "$APP_CLASS"
            echo '    override fun onCreate() {' >> "$APP_CLASS"
            echo '        super.onCreate()' >> "$APP_CLASS"
            echo '    }' >> "$APP_CLASS"
            echo '}' >> "$APP_CLASS"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK Cleanly
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=false" > ~/.gradle/gradle.properties
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties
          
          # Restore the original working sed commands to fix Compose compatibility and missing files!
          find . -name "build.gradle.kts" -exec sed -i 's/compileSdk.*/compileSdk = 36/g' {} +
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/^agp = .*/agp = "8.9.1"/' gradle/libs.versions.toml
          fi
          if [ -f google-services.json ]; then
            mkdir -p app
            mv google-services.json app/
          fi
          
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 1000 -dname "CN=Android"
          find . -name "build.gradle*" -exec sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' {} +
          
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"

