name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q *.zip
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ultimate Bulletproof Fix
        run: |
          # 1. API Key Setup
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          
          # 2. Perfect Memory & AWT Fix (headless=true is strictly required)
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true" > ~/.gradle/gradle.properties
          echo "android.useAndroidX=true" >> ~/.gradle/gradle.properties
          echo "android.enableJetifier=true" >> ~/.gradle/gradle.properties
          echo "ksp.incremental=false" >> ~/.gradle/gradle.properties
          
          # 3. Robust Version Downgrade (Guaranteed to fix Compose & KSP mismatch)
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/kotlin = "[0-9\.]*"/kotlin = "2.0.0"/g' gradle/libs.versions.toml
            sed -i 's/googleDevtoolsKsp = "[0-9\.\-]*"/googleDevtoolsKsp = "2.0.0-1.0.21"/g' gradle/libs.versions.toml
            sed -i 's/agp = "[0-9\.]*"/agp = "8.5.0"/g' gradle/libs.versions.toml
          fi
          
          # 4. FIX SCRIPT COMPILATION ERROR (API 35/36 issue)
          find . -name "build.gradle.kts" -exec sed -i 's/compileSdk.*/compileSdk = 35/g' {} +
          
          # 5. Google Services Dummy File Fix
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": { "project_number": "1", "project_id": "dummy" },
            "client": [ {
              "client_info": { "mobilesdk_app_id": "1:1:android:1", "android_client_info": { "package_name": "com.aistudio.aivideocreator.hub.v3x" } },
              "api_key": [ { "current_key": "AIzaSyDummyKeyDummyKeyDummyKeyDummyKeyD" } ]
            } ]
          }
          EOF
          
          # 6. Keystore Fix
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 1000 -dname "CN=Android"
          find . -name "build.gradle*" -exec sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")//g' {} +
          
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/*.apk"
